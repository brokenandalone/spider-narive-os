name: Build Native Spider OS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-spider-os:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout Spider OS
        uses: actions/checkout@v5

      - name: Free build disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY}" || true
          docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Validate Spider OS scripts
        run: |
          bash distro/validate-feature-complete.sh
          bash -n distro/install-feature-runtimes.sh
          bash -n distro/build-iso.sh
          bash -n distro/verify-installed-payload.sh
          test -f distro/packages/spider-os-packages.list
          test -f distro/systemd/spider-os.service
          test -f webbie/service/webbie.service
          test -f distro/config/installer/whitelabel.yaml
          test -x spider-core/bin/spider-core
          test -x webbie/webbie
          test -x webbie/agent/webbie.py

      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-yaml \
            curl \
            rsync \
            squashfs-tools \
            xorriso \
            qemu-system-x86 \
            ovmf

      - name: Validate installer catalog updater
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build Spider OS
        run: |
          sudo -E ./distro/build-iso.sh

      - name: Return build files to runner
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          chmod -R u+rwX build

      - name: Resolve ISO name
        id: iso
        run: |
          ISO="$(find build -maxdepth 1 -type f -name 'Spider_OS*_24.04.5_amd64.iso' | head -n 1)"

          if [ -z "${ISO}" ]; then
            echo "No Spider OS ISO found in build/"
            ls -lh build/
            exit 1
          fi

          echo "iso_path=${ISO}" >> "${GITHUB_OUTPUT}"
          echo "iso_name=$(basename "${ISO}")" >> "${GITHUB_OUTPUT}"

      - name: Inspect completed ISO
        run: |
          ls -lh build/
          cat "${{ steps.iso.outputs.iso_path }}.sha256"
          xorriso \
            -indev "${{ steps.iso.outputs.iso_path }}" \
            -report_el_torito plain

      - name: Split ISO for release
        run: |
          cd build

          ISO="${{ steps.iso.outputs.iso_name }}"

          split \
            -b 1900M \
            -d \
            -a 3 \
            "${ISO}" \
            "${ISO}.part-"

          cat > REASSEMBLE.txt <<TXT
          SPIDER OS ISO REASSEMBLY

          Linux/macOS:
          cat ${ISO}.part-* > ${ISO}

          Windows PowerShell:

          \$parts = Get-ChildItem "${ISO}.part-*" | Sort-Object Name

          \$output = [System.IO.File]::Create("${ISO}")

          foreach (\$part in \$parts) {
              \$input = [System.IO.File]::OpenRead(\$part.FullName)
              \$input.CopyTo(\$output)
              \$input.Dispose()
          }

          \$output.Dispose()

          Then verify ${ISO} against:
          ${ISO}.sha256
          TXT

          ls -lh "${ISO}".part-*

      - name: Publish Spider OS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO="${{ steps.iso.outputs.iso_name }}"
          TAG="spider-os-build-${GITHUB_RUN_NUMBER}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release already exists; updating assets."
          else
            gh release create "${TAG}" \
              --title "Spider OS Native Build ${GITHUB_RUN_NUMBER}" \
              --notes "Native Spider OS development build based on Ubuntu Studio 24.04.5." \
              --prerelease
          fi

          gh release upload "${TAG}" \
            build/"${ISO}".part-* \
            build/"${ISO}".sha256 \
            build/REASSEMBLE.txt \
            --clobber
