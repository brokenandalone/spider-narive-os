name: Build writable Spider OS installer

on:
  push:
    branches:
      - rebuild/native-writable-foundation-20260913-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      FEDORA_RELEASE: "44"
      FEDORA_KDE_VERSION: "1.7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Compose writable ISO in Fedora build environment
        run: |
          sudo podman run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace:Z" \
            --env FEDORA_RELEASE \
            --env FEDORA_KDE_VERSION \
            quay.io/fedora/fedora:${FEDORA_RELEASE} \
            bash -euc '
              dnf install -y cmake gcc-c++ ninja-build pkgconf-pkg-config qt6-qtbase-devel lorax curl
              cd /workspace

              if [[ ! -f native-foundation/build-native.sh ]]; then
                mkdir -p /tmp/spider-native-foundation-source

                tar -xzf Spider-OS-native-foundation.tar.gz \
                  -C /tmp/spider-native-foundation-source

                cp -a /tmp/spider-native-foundation-source/build-native.sh \
                  native-foundation/

                cp -a /tmp/spider-native-foundation-source/installer \
                  native-foundation/

                cp -a /tmp/spider-native-foundation-source/native \
                  native-foundation/

                cp -a /tmp/spider-native-foundation-source/system_files \
                  native-foundation/

                cp -a /tmp/spider-native-foundation-source/tests \
                  native-foundation/

                mkdir -p native-foundation/tools

                cp -a /tmp/spider-native-foundation-source/tools/. \
                  native-foundation/tools/
              fi

              cd /workspace/native-foundation
              chmod +x build-native.sh build-iso.sh tools/bin/mkefiboot
              ./build-iso.sh
            '

      - name: Collect writable ISO artifacts
        run: |
          set -eux
          sudo mkdir -p artifacts

          sudo find native-foundation/output \
            -maxdepth 1 \
            -type f \
            \( -name "*.iso" -o -name "*.iso.sha256" \) \
            -exec cp -v {} artifacts/ \;

          sudo chown -R "$USER":"$USER" artifacts
          ls -lh artifacts

          test "$(find artifacts -maxdepth 1 -name "*.iso" -type f | wc -l)" -gt 0

      - name: Upload writable ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: spider-os-writable-installer-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
