name: Build Spider Narive OS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-multilib binutils grub-pc-bin grub-common xorriso qemu-system-x86
      - name: Build a freestanding cross-toolchain
        run: |
          git clone --depth 1 https://github.com/lordmilko/i686-elf-tools.git "$RUNNER_TEMP/cross"
          echo "$RUNNER_TEMP/cross/bin" >> "$GITHUB_PATH"
      - name: Validate scripts
        run: bash -n scripts/build.sh scripts/run.sh
      - name: Build ISO
        run: ./scripts/build.sh
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: spider-narive-os-iso
          path: build/spider-narive-os.iso
