name: Installed-truth rebuild source checks

on:
  push:
    branches:
      - rebuild/spider-os-installed-truth-20261016
  pull_request:
    paths:
      - 'tools/spider_installed_truth.py'
      - 'tools/installed_truth_triage.py'
      - 'tools/stage_installed_source.py'
      - 'tools/prepare_installed_review.py'
      - 'tests/test_installed_truth_rebuild.py'
      - 'tests/test_installed_truth_triage.py'
      - 'tests/test_stage_installed_source.py'
      - 'tests/test_prepare_installed_review.py'
      - 'tests/test_webbie_ai_v2_reconciliation.py'
      - 'tests/test_webbie_ipc_concurrent_reconciliation.py'
      - 'tests/test_webbie_native_bay_navigation.py'
      - 'tests/test_webbie_project_review.py'
      - 'tests/test_webbie_kali_doctor.py'
      - 'tests/test_webbie_speaker_provider.py'
      - 'webbie/voice/speaker_voice_provider.py'
      - 'webbie/agent/kali_assistant.py'
      - 'webbie/actions/jarvis_orchestrator.py'
      - 'the-web/shell/webbie_jarvis_mission_center.py'
      - 'webbie/agent/workspace_launchers.py'
      - 'webbie/actions/owner_safe_access.py'
      - 'webbie/actions/action_receipts.py'
      - 'the-web/shell/webbie_operator_bridge.py'
      - 'the-web/shell/webbie_computer_panel.py'
      - 'webbie/agent/webbie.py'
      - 'webbie/agent/webbie_ai_isolation.py'
      - 'webbie/agent/webbie_ai_worker.py'
      - 'webbie/agent/webbie_brain_primary.py'
      - 'webbie/brain/brain.py'
      - 'webbie/config/default.json'
      - 'system/release_batch.py'
      - 'docs/INSTALLED_TRUTH_REBUILD_20261016.md'
      - '.github/workflows/installed-truth-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-audit-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Install native Qt test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5 dbus-bin
      - name: Verify read-only installed-source audit syntax
        run: python3 -m py_compile tools/spider_installed_truth.py tests/test_installed_truth_rebuild.py tools/installed_truth_triage.py tests/test_installed_truth_triage.py tools/stage_installed_source.py tests/test_stage_installed_source.py tools/prepare_installed_review.py tests/test_prepare_installed_review.py
      - name: Verify safe local provenance and comparison
        run: python3 -m unittest discover -s tests -p 'test_installed_truth_rebuild.py' -v
      - name: Test triage against synthetic owner backup layout
        run: python3 -m unittest discover -s tests -p 'test_installed_truth_triage.py' -v
      - name: Test checkout-only installed source staging
        run: python3 -m unittest discover -s tests -p 'test_stage_installed_source.py' -v
      - name: Test private owner review archive in a disposable Git clone
        run: python3 -m unittest discover -s tests -p 'test_prepare_installed_review.py' -v
      - name: Regression-check the merged Webbie AI V2 and owner voice permissions
        run: python3 -m unittest discover -s tests -p 'test_webbie_ai_v2_reconciliation.py' -v
      - name: Verify built-in IPC remains responsive during a slow AI request
        run: python3 -m unittest discover -s tests -p 'test_webbie_ipc_concurrent_reconciliation.py' -v
      - name: Verify real native bay navigation through the authorized Qt bridge
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests -p 'test_webbie_native_bay_navigation.py' -v
      - name: Verify owner project review and STOP cancellation
        run: python3 -m unittest discover -s tests -p 'test_webbie_project_review.py' -v
      - name: Validate real read-only Kali doctor routing
        run: python3 -m unittest discover -s tests -p 'test_webbie_kali_doctor.py' -v
      - name: Verify private offline speaker enrollment cannot bypass voice trust
        run: python3 -m unittest discover -s tests -p 'test_webbie_speaker_provider.py' -v
      - name: Verify guarded daily release policy imports and compiles
        run: python3 -m py_compile system/daily_install_policy.py system/release_batch.py
      - name: Enforce no invented PC snapshot in Git history
        run: |
          test ! -e docs/installed-pc-manifest.json
          test ! -e installed-snapshot.tar.gz
          test ! -e installed-snapshot.zip
          echo 'Source checks passed. Live PC remains NOT YET RECONCILED.'
