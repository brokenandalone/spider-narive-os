name: Spider Audio Studio gated beta package

on:
  push:
    branches:
      - feature/spider-audio-instruments-20261015
      - feature/spider-audio-product-beta-20261016
    paths:
      - 'studio/**'
      - 'system/apps.py'
      - 'the-web/shell/workspace_max_native.py'
      - 'spider_max_source/**'
      - '.github/workflows/spider-audio-studio-preview.yml'
  pull_request:
    paths:
      - 'studio/**'
      - 'system/apps.py'
      - 'the-web/shell/workspace_max_native.py'
      - 'spider_max_source/**'
      - '.github/workflows/spider-audio-studio-preview.yml'

permissions:
  contents: read

jobs:
  build-owner-preview:
    name: Package native Audio Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact GitHub source revision
        uses: actions/checkout@v4
      - name: Build isolated Audio Studio source package
        run: python3 studio/package/build_standalone.py --output-dir "$RUNNER_TEMP"
      - name: Verify extracted runtime and manifest
        run: |
          mkdir -p "$RUNNER_TEMP/verified"
          tar -xzf "$RUNNER_TEMP/Spider-Audio-Studio-0.15.0-beta.tar.gz" -C "$RUNNER_TEMP/verified"
          python3 "$RUNNER_TEMP/verified/Spider-Audio-Studio-0.15.0-beta/run_spider_audio_studio.py" --verify-only
      - name: Validate no-overwrite user installer and commercial release gate
        run: |
          python3 "$RUNNER_TEMP/verified/Spider-Audio-Studio-0.15.0-beta/install_for_user.py" --check
          python3 studio/package/commercial_release_gate.py --assert-blocked
      - name: Run real offline music-engine self-test in packaged app
        run: |
          python3 "$RUNNER_TEMP/verified/Spider-Audio-Studio-0.15.0-beta/run_spider_audio_studio.py" --self-test
      - name: Publish private developer preview archive
        uses: actions/upload-artifact@v4
        with:
          name: Spider-Audio-Studio-0.15.0-beta
          path: ${{ runner.temp }}/Spider-Audio-Studio-0.15.0-beta.tar.gz
          if-no-files-found: error
          retention-days: 14
