name: Validate Ubuntu Studio 26.10 final

on:
  push:
    branches: ['migration/ubuntu-studio-26.10']
    paths:
      - '.github/workflows/validate-26-10.yml'
      - 'distro/**'
      - 'tests/**'
      - 'webbie/**'
      - 'the-web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-26-10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      SPM_PROFILE: public
      QT_QPA_PLATFORM: offscreen
      QT_ACCESSIBILITY: '0'
      QTWEBENGINE_DISABLE_SANDBOX: '1'
    steps:
      - name: Checkout migration snapshot
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Record validation scope
        run: |
          mkdir -p build/upstream-probe
          git rev-parse HEAD > build/upstream-probe/source-commit.txt
          printf '%s\n' 'Experimental migration snapshot; passing is not approval for installation on the working PC.' 'Encrypted install/unlock, graphical session, audio, authorized voice users and features not present in the pinned Git source remain separate gates.' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare disposable hosted runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h
          free_bytes="$(df --output=avail -B1 . | tail -n 1 | tr -d ' ')"
          test "$free_bytes" -ge 45000000000 || { echo 'Insufficient runner space for ISO and extraction'; exit 1; }

      - name: Install source test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml python3-docx python3-pyqt5 python3-pyqt5.qtwebengine dbus-bin
          /usr/bin/python3 -m compileall -q author studio study webbie forage kali-bay the-web system media spider_max_source
      - name: Validate Spider OS scripts
        run: |
          bash distro/validate-feature-complete.sh
          bash -n distro/install-feature-runtimes.sh
          bash -n distro/build-iso.sh
          test -f distro/config/base.env
          bash -c 'set -a; source distro/config/base.env; test "$UBUNTU_RELEASE" = "26.10"; test "$UBUNTU_CODENAME" = "stonking"; test -n "$UBUNTU_IMAGE_NAME"'
          bash -n distro/verify-installed-payload.sh
          bash -n distro/verify-iso.sh
          bash -n tests/qemu-install.sh
          test -f distro/packages/spider-os-packages.list
          test -f distro/systemd/spider-os.service
          test -f webbie/service/webbie.service
          test -f distro/config/installer/whitelabel.yaml
          test -x spider-core/bin/spider-core
          test -x webbie/webbie
          test -x webbie/agent/webbie.py

      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-yaml \
            python3-pyqt5 \
            dbus-bin \
            curl \
            rsync \
            squashfs-tools \
            xorriso \
            qemu-system-x86 \
            ovmf

      - name: Validate installer catalog updater
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Check The Web and all backgrounds
        run: |
          QT_QPA_PLATFORM=offscreen QT_ACCESSIBILITY=0 \
            timeout --kill-after=5 120 dbus-run-session -- /usr/bin/python3 -u tests/check-the-web.py .


      - name: Check native School and installed desktop integration
        run: |
          timeout --kill-after=5 120 dbus-run-session -- /usr/bin/python3 -u tests/check-school-ui.py

      - name: Verify final upstream ISO and layer assumptions
        run: |
          set -Eeuo pipefail
          source distro/config/base.env
          test "$UBUNTU_CHANNEL" = release
          test "$UBUNTU_IMAGE_VERSION" = 26.10
          mkdir -p build/upstream-probe build/iso-mount
          base="$UBUNTU_CDIMAGE_BASE/$UBUNTU_RELEASE_PATH"
          curl --fail --location --retry 3 --max-time 180 "$base/SHA256SUMS" -o build/upstream-probe/SHA256SUMS
          curl --fail --location --retry 3 --max-time 180 "$base/SHA256SUMS.gpg" -o build/upstream-probe/SHA256SUMS.gpg
          gpgv --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg build/upstream-probe/SHA256SUMS.gpg build/upstream-probe/SHA256SUMS
          curl --fail --location --retry 3 --max-time 1800 "$base/$UBUNTU_IMAGE_NAME" -o "build/$UBUNTU_IMAGE_NAME"
          /usr/bin/python3 - <<'PY'
          import hashlib, os, pathlib, re
          root = pathlib.Path("build")
          name = os.environ["ISO_NAME"]
          lines = (root/"upstream-probe/SHA256SUMS").read_text().splitlines()
          matches = [line.split()[0] for line in lines if line.split(maxsplit=1)[-1].lstrip("*") == name]
          if len(matches) != 1 or not re.fullmatch(r"[0-9a-f]{64}", matches[0]):
              raise SystemExit("Expected exactly one valid upstream checksum for " + name)
          with (root/name).open("rb") as f:
              actual = hashlib.file_digest(f, "sha256").hexdigest()
          if actual != matches[0]:
              raise SystemExit("Upstream ISO checksum mismatch")
          (root/"upstream-probe/verified-sha256.txt").write_text(actual + "  " + name + "\n")
          PY
          sudo mount -o loop,ro "build/$UBUNTU_IMAGE_NAME" build/iso-mount
          trap 'sudo umount build/iso-mount' EXIT
          find build/iso-mount/casper -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > build/upstream-probe/casper-files.txt
          xorriso -indev "build/$UBUNTU_IMAGE_NAME" -report_el_torito plain > build/upstream-probe/boot-metadata.txt 2>&1
          cp build/iso-mount/casper/install-sources.yaml build/upstream-probe/
          cp build/iso-mount/boot/grub/grub.cfg build/upstream-probe/upstream-grub.cfg
          for image in build/iso-mount/casper/*.squashfs; do
            unsquashfs -s "$image" > "build/upstream-probe/$(basename "$image").superblock.txt"
          done
          test -s build/iso-mount/casper/vmlinuz
          test -s build/iso-mount/casper/initrd
          /usr/bin/python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import importlib.util
          import yaml
          casper = Path("build/iso-mount/casper")
          catalog = yaml.safe_load((casper/"install-sources.yaml").read_text())
          sources = catalog if isinstance(catalog, list) else catalog["sources"]
          defaults = [s for s in sources if s.get("default")]
          if len(defaults) != 1:
              raise SystemExit("Installer default source selection changed")
          default_paths = set()
          for source in sources:
              for entry in [source, *source.get("variations", {}).values()]:
                  name = entry.get("path")
                  if not name:
                      continue
                  rel = PurePosixPath(name)
                  if rel.is_absolute() or ".." in rel.parts or not (casper/name).is_file():
                      raise SystemExit("Unsupported or missing installer source: " + name)
                  if source is defaults[0]:
                      default_paths.add(name)
          if default_paths == {"minimal.standard.squashfs"}:
              for name in ("minimal.squashfs", "minimal.standard.squashfs", "minimal.standard.live.squashfs"):
                  if not (casper/name).is_file():
                      raise SystemExit("Missing required layer: " + name)
              spec = importlib.util.spec_from_file_location("layout", "distro/normalize-install-layout.py")
              layout = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(layout)
              normalized = layout.normalize(catalog)
              Path("build/upstream-probe/normalized-install-sources.yaml").write_text(yaml.safe_dump(normalized, sort_keys=False))
          elif default_paths != {"standard.squashfs"}:
              raise SystemExit("Unverified default installed filesystem selection: " + str(default_paths))
          PY
        env:
          ISO_NAME: ubuntustudio-26.10-desktop-amd64.iso

      - name: Verify installed layer reconstruction with synthetic images
        run: sudo bash tests/check-install-layer-merge.sh

      - name: Build Spider OS
        run: |
          sudo -E ./distro/build-iso.sh

      - name: Return build files to runner
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          chmod -R u+rwX build

      - name: Resolve ISO name
        id: iso
        run: |
          source distro/config/base.env
          ISO="build/Spider_OS_${UBUNTU_IMAGE_VERSION}_amd64.iso"

          if [ ! -s "${ISO}" ]; then
            echo "No Spider OS ISO found in build/"
            ls -lh build/
            exit 1
          fi

          echo "iso_path=${ISO}" >> "${GITHUB_OUTPUT}"
          echo "iso_name=$(basename "${ISO}")" >> "${GITHUB_OUTPUT}"

      - name: Inspect completed ISO
        run: |
          ls -lh build/
          cat "${{ steps.iso.outputs.iso_path }}.sha256"
          xorriso \
            -indev "${{ steps.iso.outputs.iso_path }}" \
            -report_el_torito plain

      - name: Free temporary image space
        run: |
          source distro/config/base.env
          sudo rm -rf build/iso-tree
          rm -f "build/${UBUNTU_IMAGE_NAME}"

      - name: Install and boot from a writable virtual disk
        timeout-minutes: 110
        run: sudo -E bash tests/qemu-install.sh "${{ steps.iso.outputs.iso_path }}"

      - name: Save installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spider-install-diagnostics
          path: |
            build/install-test/*.log*
            build/*.boot-report.txt
          if-no-files-found: ignore


      - name: Save upstream inspection and qualification scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-studio-26-10-validation
          path: build/upstream-probe/
          if-no-files-found: warn
          retention-days: 14

      - name: Report limited qualification result
        run: |
          printf '%s\n' 'Final ISO integrity, expected layers, source tests, Spider image build and existing writable UEFI virtual-disk install/boot gate passed.' 'NOT YET QUALIFIED: graphical Wayland session, Webbie user-session behavior, sound hardware, encrypted unlock, second reboot and real-machine continuity against any newer private/local updates.' >> "$GITHUB_STEP_SUMMARY"
